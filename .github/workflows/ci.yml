name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: cicd integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Skips two known pre-existing failures (handler_test.go:73,
      # tracking_server_test.go:138) so CI is red only for regressions.
      - name: Run cicd suite
        run: make cicd-tests-ci

  publish:
    name: build image + helm chart
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hekemen
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          registry-server: ghcr.io
          registry-username: hekemen
          registry-password: ${{ secrets.GHCR_PAT }}
          tags: ghcr.io/${{ github.repository_owner }}/automata:${{ steps.sha.outputs.short }}
      - name: Package and push helm chart
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.short }}"
          VERSION="$(date -u +%Y.%m.%d)-${SHA}"
          WORK="$(mktemp -d)"
          cp -r helm/automata "${WORK}/chart"
          sed -i "s/^version:.*/version: ${VERSION}/" "${WORK}/chart/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${SHA}\"/" "${WORK}/chart/Chart.yaml"
          helm package "${WORK}/chart" --destination "${WORK}"
          echo "${{ secrets.GHCR_PAT }}" | helm registry login ghcr.io -u hekemen --password-stdin
          helm push "${WORK}/automata-${VERSION}.tgz" oci://ghcr.io/hekemen/automata-chart
          echo "Published ghcr.io/hekemen/automata:${SHA} and chart version ${VERSION}"
          echo "Deploy: make deploy-staging IMG=${SHA} CHART=${VERSION}"