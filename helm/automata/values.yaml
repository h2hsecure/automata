# Default values for automata.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/h2hsecure/automata
  tag: "latest"
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-registry

automata:
  replicaCount: 1
  uploads:
    # Pod-internal directory for form file uploads + static files.
    # A PVC of `storage` size is created and mounted here.
    dir: /var/lib/automata/uploads
    storage: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

bff:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  # Renders a Traefik IngressRoute (traefik.io/v1alpha1) + a Middleware.
  # Routes /snippet, /track, /form, /static -> tracking :8081 and / -> BFF :8082.
  enabled: true
  hostname: automata.home.arpa
  # Optional Traefik annotations for the IngressRoute (e.g.
  # traefik.ingress.kubernetes.io/router.priority).
  annotations: {}
  # Max request body size for file uploads, as an integer byte count,
  # rendered as Traefik v3's `buffering.maxRequestBodyBytes` (v2's
  # `requestBody.maxBodySize` was removed in v3).
  # Default below is 100 MiB, matching the old nginx Ingress's 100M limit.
  maxBodySize: 104857600
  # Optional TLS termination. secretName becomes spec.tls.secretName on the
  # IngressRoute. hosts are ignored by Traefik (matching is on `hostname`)
  # but are reused as dnsNames when certificate.enabled is true.
  # Example:
  # tls:
  #   - hosts: [example.com]
  #     secretName: automata-tls
  tls: []
  # cert-manager does not watch Traefik IngressRoute resources, so TLS
  # secrets cannot be provisioned via annotations. When enabled (and
  # ingress.tls is non-empty), renders a Certificate that provisions the
  # tls[].secretName secret. Requires cert-manager installed in-cluster.
  certificate:
    enabled: false
    issuer: ""          # e.g. "letsencrypt-prod"
    isClusterIssuer: true

# Secrets live in values.local.yaml (gitignored) — never commit real values.
secretKey: "change-this-in-production"
cookieSecret: "change-this-in-production"
adminEmail: "admin@automata.local"
adminPassword: ""

database:
  # PostgreSQL connection settings (overridden by sub-chart if enabled)
  host: ""
  port: "5432"
  name: automata
  user: automata

postgresql:
  enabled: true
  auth:
    database: automata
    username: automata
    password: ""
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
