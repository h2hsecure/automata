# Default values for automata.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/h2hsecure/automata
  tag: "latest"
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-registry

automata:
  replicaCount: 1
  uploads:
    # Pod-internal directory for form file uploads + static files.
    # A PVC of `storage` size is created and mounted here.
    dir: /var/lib/automata/uploads
    storage: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

bff:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  # Renders a Gateway + HTTPRoutes (gateway.networking.k8s.io/v1), bound to
  # the GatewayClass named in `gatewayClass` (the cluster runs Traefik).
  # Routes /snippet, /track, /form, /static -> tracking :8081 and / -> BFF :8082.
  enabled: true
  hostname: automata.home.arpa
  # Name of the GatewayClass the Gateway binds to
  # (`kubectl get gatewayclass`; Traefik's default is "traefik").
  gatewayClass: traefik
  # Optional annotations for the Gateway + HTTPRoutes.
  annotations: {}
  # Max request body size for file uploads, as an integer byte count,
  # rendered as a RequestBodyLimit filter on every HTTPRoute rule.
  # Default below is 100 MiB, matching the old nginx Ingress's 100M limit.
  maxBodySize: 104857600
  # Optional TLS termination. secretName becomes the Gateway listener's
  # tls.certificateRefs secret. hosts are ignored by the gateway (matching is
  # on `hostname`) but are reused as dnsNames when certificate.enabled is
  # true.
  # Example:
  # tls:
  #   - hosts: [example.com]
  #     secretName: automata-tls
  tls: []
  # cert-manager does not watch Gateway resources, so the TLS secret is
  # provisioned by a chart-rendered Certificate (not annotations).
  # REQUIRED when ingress.tls is non-empty: enabled must be true and
  # clusterIssuer must name the ClusterIssuer (e.g. "letsencrypt-prod").
  # Requires cert-manager installed in-cluster.
  certificate:
    enabled: false
    clusterIssuer: ""   # e.g. "letsencrypt-prod"

# Secrets live in values.local.yaml (gitignored) — never commit real values.
secretKey: "change-this-in-production"
cookieSecret: "change-this-in-production"
adminEmail: "admin@automata.local"
adminPassword: ""

database:
  # PostgreSQL connection settings (overridden by sub-chart if enabled)
  host: ""
  port: "5432"
  name: automata
  user: automata

postgresql:
  enabled: true
  auth:
    database: automata
    username: automata
    password: ""
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
