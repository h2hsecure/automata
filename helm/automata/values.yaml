# Default values for automata.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/hekemen/automata
  tag: "latest"
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-registry

automata:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

bff:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  hostname: automata.home.arpa
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  # Optional TLS termination. When non-empty, rendered into spec.tls.
  # With cert-manager, pair with a cert-manager.io/issuer (or
  # cluster-issuer) annotation so the cert is provisioned into secretName.
  # Example:
  # tls:
  #   - hosts: [example.com]
  #     secretName: automata-tls
  tls: []

# Secrets live in values.local.yaml (gitignored) — never commit real values.
secretKey: "change-this-in-production"
cookieSecret: "change-this-in-production"
adminEmail: "admin@automata.local"
adminPassword: ""

database:
  # PostgreSQL connection settings (overridden by sub-chart if enabled)
  host: ""
  port: "5432"
  name: automata
  user: automata

postgresql:
  enabled: true
  auth:
    database: automata
    username: automata
    password: ""
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
