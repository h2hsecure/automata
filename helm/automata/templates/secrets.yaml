{{- if not .Values.postgresql.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "automata.fullname" . }}-db
  labels:
    {{- include "automata.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_PASSWORD: {{ .Values.database.password | b64enc | quote }}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "automata.fullname" . }}-postgres-auth
  labels:
    {{- include "automata.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end -}}
