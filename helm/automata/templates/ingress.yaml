{{- if .Values.ingress.enabled -}}
{{- if .Values.ingress.tls -}}
{{- if not .Values.ingress.certificate.enabled -}}
{{- fail "ingress.tls is set, so ingress.certificate.enabled must be true: the chart provisions the TLS secret via a cert-manager Certificate (cert-manager does not watch Gateway resources)" -}}
{{- end -}}
{{- if not .Values.ingress.certificate.clusterIssuer -}}
{{- fail "ingress.certificate.enabled=true requires ingress.certificate.clusterIssuer (e.g. \"letsencrypt-prod\")" -}}
{{- end -}}
{{- end -}}
# Gateway API (gateway.networking.k8s.io/v1) — replaces the old Traefik
# IngressRoute + Middleware pair. Binds to the GatewayClass named in
# ingress.gatewayClass (default: traefik; `kubectl get gatewayclass`).
#
# Routing (unchanged from the old IngressRoute):
#   /snippet, /track, /form/, /static/ -> tracking service :8081
#   /                                   -> BFF service :8082
#
# Upload body limit: every rule carries a RequestBodyLimit filter
# (ingress.maxBodySize, int64 bytes; default 104857600 = 100 MiB) — the
# Gateway API equivalent of the old Traefik `buffering.maxRequestBodyBytes`
# middleware.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "automata.fullname" . }}
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.ingress.gatewayClass }}
  {{- if .Values.ingress.tls }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hosts:
        - {{ .Values.ingress.hostname | quote }}
      tls:
        certificateRefs:
          - kind: Secret
            name: {{ (index .Values.ingress.tls 0).secretName | quote }}
    # HTTP listener so the -route-http HTTPRoute can 301 to HTTPS.
    - name: http
      protocol: HTTP
      port: 80
      hosts:
        - {{ .Values.ingress.hostname | quote }}
  {{- else }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hosts:
        - {{ .Values.ingress.hostname | quote }}
  {{- end }}
---
# Trailing slashes on /form/ and /static/ are intentional: the bare prefixes
# would also match the admin SPA routes /forms and /static-files (and
# /forms/:id/submissions) and 404 them. /snippet and /track have no
# colliding SPA routes, so they stay bare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "automata.fullname" . }}-route
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  parentRefs:
    - name: {{ include "automata.fullname" . }}
  rules:
    {{- range list "/snippet" "/track" "/form/" "/static/" }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      filters:
        - type: RequestBodyLimit
          # `value` is the Gateway API v1.0 field name (v1.1 renames it to
          # `bodySize`; `value` remains supported).
          value: {{ $.Values.ingress.maxBodySize | int }}
      backendRefs:
        - name: {{ include "automata.fullname" $ }}-automata
          port: 8081
          protocol: HTTP
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestBodyLimit
          value: {{ $.Values.ingress.maxBodySize | int }}
      backendRefs:
        - name: {{ include "automata.fullname" $ }}-bff
          port: 8082
          protocol: HTTP
{{- if .Values.ingress.tls }}
---
# HTTP -> HTTPS: every request for this host on port 80 is 301-redirected to
# HTTPS. Redirect-only routes need no backendRef (unlike the old Traefik
# build, which required a placeholder service on service-less routers).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "automata.fullname" . }}-route-http
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  parentRefs:
    - name: {{ include "automata.fullname" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          scheme: https
          statusCode: 301
{{- end }}
{{- end }}