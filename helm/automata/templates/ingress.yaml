{{- if .Values.ingress.enabled -}}
{{- if .Values.ingress.tls -}}
{{- if not .Values.ingress.certificate.enabled -}}
{{- fail "ingress.tls is set, so ingress.certificate.enabled must be true: the chart provisions the TLS secret via a cert-manager Certificate (cert-manager does not watch Gateway resources)" -}}
{{- end -}}
{{- if not .Values.ingress.certificate.clusterIssuer -}}
{{- fail "ingress.certificate.enabled=true requires ingress.certificate.clusterIssuer (e.g. \"letsencrypt-prod\")" -}}
{{- end -}}
{{- end -}}
# Gateway API (gateway.networking.k8s.io/v1) — replaces the old Traefik
# IngressRoute objects. A single Traefik Middleware (rendered above) carries
# the body limit, referenced from every rule via an ExtensionRef filter.
# Binds to the GatewayClass named in ingress.gatewayClass
# (default: traefik; `kubectl get gatewayclass`).
#
# Routing (unchanged from the old IngressRoute):
#   /snippet, /track, /form/, /static/ -> tracking service :8081
#   /                                   -> BFF service :8082
#
# Upload body limit: Gateway API has no standard body-limit filter type, so
# each rule carries an ExtensionRef filter (the spec's vendor-extension
# mechanism) pointing at the Traefik Middleware below, which sets
# buffering.maxRequestBodyBytes (ingress.maxBodySize, int64 bytes;
# default 104857600 = 100 MiB) — the same mechanism as the old IngressRoute.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "automata.fullname" . }}-body-limit
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.maxBodySize | int }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "automata.fullname" . }}
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.ingress.gatewayClass }}
  {{- if .Values.ingress.tls }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.hostname | quote }}
      tls:
        certificateRefs:
          - kind: Secret
            name: {{ (index .Values.ingress.tls 0).secretName | quote }}
    # HTTP listener so the -route-http HTTPRoute can 301 to HTTPS.
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ingress.hostname | quote }}
  {{- else }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ingress.hostname | quote }}
  {{- end }}
---
# Trailing slashes on /form/ and /static/ are intentional: the bare prefixes
# would also match the admin SPA routes /forms and /static-files (and
# /forms/:id/submissions) and 404 them. /snippet and /track have no
# colliding SPA routes, so they stay bare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "automata.fullname" . }}-route
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  parentRefs:
    - name: {{ include "automata.fullname" . }}
  rules:
    {{- range list "/snippet" "/track" "/form/" "/static/" }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ include "automata.fullname" $ }}-body-limit
      backendRefs:
        - name: {{ include "automata.fullname" $ }}-automata
          port: 8081
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ include "automata.fullname" $ }}-body-limit
      backendRefs:
        - name: {{ include "automata.fullname" $ }}-bff
          port: 8082
{{- if .Values.ingress.tls }}
---
# HTTP -> HTTPS: every request for this host on port 80 is 301-redirected to
# HTTPS. Redirect-only routes need no backendRef (unlike the old Traefik
# build, which required a placeholder service on service-less routers).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "automata.fullname" . }}-route-http
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  parentRefs:
    - name: {{ include "automata.fullname" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}