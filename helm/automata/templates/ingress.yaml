{{- if .Values.ingress.enabled -}}
# Body-size limit for form/static file uploads. Traefik's default is 10 MiB;
# override with ingress.maxBodySize (integer bytes; e.g. 52428800 = 50 MiB).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "automata.fullname" . }}-bodylimit
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.maxBodySize }}
  # Traefik v2: the limit lives under `requestBody` as an int64 byte count.
  # A bare top-level `maxBodySize` (or a string like "100M") is rejected with
  # "invalid middleware type or middleware does not exist", which takes down
  # every router that references this middleware.
  requestBody:
    # `int` keeps large byte counts as plain decimal (Helm would otherwise
    # print 104857600 as 1.048576e+08).
    maxBodySize: {{ .Values.ingress.maxBodySize | int }}
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "automata.fullname" . }}-route
  labels:
    {{- include "automata.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- if .Values.ingress.tls }}
    # TLS configured: serve HTTPS only; the -route-http route below 301s all
    # HTTP traffic for this host to HTTPS.
    - websecure
    {{- else }}
    - web
    - websecure
    {{- end }}
  routes:
    # Tracking server (snippet, tracking events, public forms, static files)
    - kind: Rule
      match: (Host(`{{ .Values.ingress.hostname }}`)) && (PathPrefix(`/snippet`) || PathPrefix(`/track`) || PathPrefix(`/form`) || PathPrefix(`/static`))
      middlewares:
        - name: {{ include "automata.fullname" . }}-bodylimit
      services:
        - name: {{ include "automata.fullname" . }}-automata
          port: 8081
    # Frontend + API proxy via BFF
    - kind: Rule
      match: (Host(`{{ .Values.ingress.hostname }}`)) && PathPrefix(`/`)
      middlewares:
        - name: {{ include "automata.fullname" . }}-bodylimit
      services:
        - name: {{ include "automata.fullname" . }}-bff
          port: 8082
  {{- if .Values.ingress.tls }}
  tls:
    secretName: {{ (index .Values.ingress.tls 0).secretName | quote }}
  {{- end }}
{{- if .Values.ingress.tls }}
---
# HTTP -> HTTPS: every request for this host on the web entrypoint is
# redirected (301 permanent) to HTTPS. No service needed for redirectScheme.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "automata.fullname" . }}-redirect
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "automata.fullname" . }}-route-http
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.hostname }}`) && PathPrefix(`/`)
      middlewares:
        - name: {{ include "automata.fullname" . }}-redirect
      services:
        # Placeholder: the redirectScheme middleware terminates the request
        # before it reaches any service. Some Traefik builds reject routers
        # that have neither a service nor child routers
        # ("router must have either a service or child routers"), so the
        # BFF is listed to satisfy the check — it is never contacted.
        - name: {{ include "automata.fullname" . }}-bff
          port: 8082
{{- end }}
{{- end }}