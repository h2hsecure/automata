{{- if and .Values.ingress.enabled .Values.ingress.tls .Values.ingress.certificate.enabled .Values.ingress.certificate.issuer -}}
{{- /*
cert-manager does not watch Traefik IngressRoute resources, so the TLS
secret cannot be provisioned via ingress annotations. This Certificate
provisions the secret named in ingress.tls[].secretName, which the
IngressRoute references in spec.tls.secretName.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "automata.fullname" . }}-tls
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  secretName: {{ (index .Values.ingress.tls 0).secretName }}
  dnsNames:
    {{- $names := list }}
    {{- range .Values.ingress.tls }}
    {{- if kindIs "string" .hosts }}
    {{- $names = append $names .hosts }}
    {{- else }}
    {{- $names = concat $names .hosts }}
    {{- end }}
    {{- end }}
    {{- range $names }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.ingress.certificate.issuer }}
    kind: {{ ternary "ClusterIssuer" "Issuer" .Values.ingress.certificate.isClusterIssuer }}
{{- end }}