{{- if and .Values.ingress.enabled .Values.ingress.tls .Values.ingress.certificate.enabled .Values.ingress.certificate.clusterIssuer -}}
{{- /*
cert-manager does not watch Gateway resources, so the TLS secret cannot be
provisioned via annotations. This Certificate provisions the secret named in
ingress.tls[].secretName, which the Gateway references in
spec.listeners[].tls.certificateRefs. The issuer is always a ClusterIssuer,
named in ingress.certificate.clusterIssuer (e.g. "letsencrypt-prod").
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "automata.fullname" . }}-tls
  labels:
    {{- include "automata.labels" . | nindent 4 }}
spec:
  secretName: {{ (index .Values.ingress.tls 0).secretName }}
  dnsNames:
    {{- $names := list }}
    {{- range .Values.ingress.tls }}
    {{- if kindIs "string" .hosts }}
    {{- $names = append $names .hosts }}
    {{- else }}
    {{- $names = concat $names .hosts }}
    {{- end }}
    {{- end }}
    {{- range $names }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.ingress.certificate.clusterIssuer }}
    kind: ClusterIssuer
{{- end }}