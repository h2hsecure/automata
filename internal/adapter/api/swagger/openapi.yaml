components:
  schemas:
    Context:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContextInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean, default: true }
    ContextInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    Contact:
      type: object
      description: Contact entity. JSON keys are the Go field names (no tags).
      properties:
        ID: { type: string, format: uuid }
        ContextID: { type: string, format: uuid }
        Email: { type: ["string", "null"] }
        FirstName: { type: string }
        LastName: { type: string }
        Phone: { type: string }
        Company: { type: string }
        CustomFields: { type: object, additionalProperties: true }
        Source: { type: string, description: e.g. form, tracking, manual }
        SourceID: { type: string }
        Hidden: { type: boolean, description: true for anonymous visitor contacts }
        Tags:
          type: array
          items: { type: object }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    ContactInput:
      type: object
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        company: { type: string }
        source: { type: string }
        custom_fields: { type: object, additionalProperties: true }
    FormInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        context_id: { type: string, format: uuid }
        name: { type: string }
        expires_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
    APIKeyCreated:
      type: object
      description: Creation response — the plaintext key appears only here.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: string, description: "Plaintext key (ak_...), shown once" }
        expires_at: { type: ["string", "null"], format: date-time }
    DashboardMetrics:
      type: object
      properties:
        total_visitors: { type: integer }
        active_visitors: { type: integer }
        page_views: { type: integer }
        top_pages:
          type: array
          items:
            type: object
            properties:
              URL: { type: string }
              Count: { type: integer }
        top_referrers:
          type: array
          items:
            type: object
            properties:
              Referrer: { type: string }
              Count: { type: integer }
        device_breakdown: { type: object, additionalProperties: { type: integer } }
        browser_breakdown: { type: object, additionalProperties: { type: integer } }
  responses:
    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "invalid token or API key" }